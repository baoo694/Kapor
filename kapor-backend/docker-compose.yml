services:
  # ---- Core Application ----
  kapor-api:
    build: .
    env_file:
      - .env.local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongo:27017/kapor
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      NLP_SERVICE_URL: http://kapor-nlp:8001
      WHISPERX_SERVICE_URL: http://kapor-nlp:8001
      WHISPER_SERVICE_URL: http://kapor-nlp:8001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ---- NLP Microservice ----
  kapor-nlp:
    build:
      context: ./kapor-nlp
      dockerfile: Dockerfile.gpu
    ports:
      - "8001:8001"
    volumes:
      - whisper_models:/models
    restart: unless-stopped
    environment:
      HF_HOME: /models
      # GPU defaults for the NVIDIA production VM. The model remains cached
      # in the named volume across container recreations.
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3-turbo}
      WHISPERX_DEVICE: ${WHISPERX_DEVICE:-cuda}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      WHISPERX_VAD_METHOD: ${WHISPERX_VAD_METHOD:-silero}
      # Start conservatively on a 16 GB NVIDIA T4. Increase only after benchmarking.
      WHISPERX_BATCH_SIZE: ${WHISPERX_GPU_BATCH_SIZE:-4}
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---- Database ----
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: --wiredTigerCacheSizeGB 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Cache ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Object Storage ----
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  minio_data:
  whisper_models:
