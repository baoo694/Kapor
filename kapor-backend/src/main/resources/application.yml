server:
  port: 8080

spring:
  application:
    name: kapor-backend
  config:
    # Enables local development with kapor-backend/.env while deployment still
    # receives the same variables from the container environment.
    import: optional:file:.env[.properties]

  # MongoDB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kapor}
      auto-index-creation: false

    # Redis
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Mail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:kapor-dev-secret-key-change-in-production-min-256-bits-long}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 2592000000 # 30 days

# Google OAuth2
google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}

# Gemini AI
gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL:gemini-2.5-flash}
  subtitle-batch-size: 12
  tts:
    model-name: ${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
    voice-name: ${GEMINI_TTS_VOICE:Kore}
    prompt-version: ${GEMINI_TTS_PROMPT_VERSION:v1}
    max-cache-misses-per-minute: ${GEMINI_TTS_MAX_CACHE_MISSES_PER_MINUTE:12}

# TechTalk AI
techtalk:
  seed-default-content: ${TECHTALK_SEED_DEFAULT_CONTENT:true}
  ai:
    temperature: ${TECHTALK_AI_TEMPERATURE:0.65}
    max-output-tokens: ${TECHTALK_AI_MAX_OUTPUT_TOKENS:512}
  quota:
    turns-per-minute: ${TECHTALK_TURNS_PER_MINUTE:5}
    turns-per-day: ${TECHTALK_TURNS_PER_DAY:100}
    max-turns-per-session: ${TECHTALK_MAX_TURNS_PER_SESSION:30}
  session:
    stale-after-hours: ${TECHTALK_SESSION_STALE_HOURS:12}
    test-retention-hours: ${TECHTALK_TEST_SESSION_RETENTION_HOURS:24}
    cleanup-cron: ${TECHTALK_SESSION_CLEANUP_CRON:0 15 * * * *}
  audio:
    retention-days: ${TECHTALK_AUDIO_RETENTION_DAYS:7}
    cleanup-cron: ${TECHTALK_AUDIO_CLEANUP_CRON:0 25 3 * * *}
# MinIO (Object Storage)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:kapor}

# Azure is the sole source of pronunciation scores. Keep credentials in the
# runtime environment or a secret manager; never expose them to Flutter.
azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:}
    locale: ${AZURE_SPEECH_LOCALE:ko-KR}

# WhisperX owns only transcript and word-level UI timestamps.
whisperx:
  service-url: ${WHISPERX_SERVICE_URL:${WHISPER_SERVICE_URL:http://localhost:8001}}

pronunciation:
  audio:
    # Learner recordings are private and deleted after seven days by default.
    cleanup-cron: ${PRONUNCIATION_AUDIO_CLEANUP_CRON:0 20 3 * * *}

# NLP Microservice
nlp:
  service-url: ${NLP_SERVICE_URL:http://localhost:8001}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.kapor: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
